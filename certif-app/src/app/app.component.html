<div class="layout" [class.collapsed]="sidebarCollapsed" *ngIf="!isLoginPage(); else loginOutlet">
  <aside class="sidebar">
    <div class="sidebar-header d-flex align-items-center justify-content-between">
      <div class="brand" [class.collapsed-brand]="sidebarCollapsed">
        <h5 class="mb-0 text-white brand-title">CertiVault</h5>
      </div>
      <button class="btn btn-sm btn-outline-light" (click)="toggleSidebar()" [attr.aria-expanded]="!sidebarCollapsed">
        <i class="fas" [class.fa-chevron-left]="!sidebarCollapsed" [class.fa-chevron-right]="sidebarCollapsed"></i>
      </button>
    </div>
    <nav class="nav flex-column">
      <a class="nav-link" routerLink="/dashboard" routerLinkActive="active">
        <i class="fas fa-tachometer-alt me-2"></i>
        <span class="link-text">Dashboard</span>
      </a>
      <a class="nav-link" routerLink="/certifications" routerLinkActive="active">
        <i class="fas fa-certificate me-2"></i>
        <span class="link-text">Certificaciones</span>
      </a>
      <a class="nav-link" routerLink="/users" routerLinkActive="active" *ngIf="canSeeUsers()">
        <i class="fas fa-users me-2"></i>
        <span class="link-text">Usuarios</span>
      </a>
      <a class="nav-link" routerLink="/profile" routerLinkActive="active">
        <i class="fas fa-user me-2"></i>
        <span class="link-text">Mi Perfil</span>
      </a>
      <a class="nav-link" routerLink="/settings" routerLinkActive="active" *ngIf="authService.isAdmin()">
        <i class="fas fa-cog me-2"></i>
        <span class="link-text">Configuraciones</span>
      </a>
    </nav>
    <div class="sidebar-footer mt-auto">
      <button class="btn btn-outline-light w-100" (click)="logout()">
        <i class="fas fa-sign-out-alt me-2"></i>
        <span class="link-text">Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>

<ng-template #loginOutlet>
  <router-outlet></router-outlet>
</ng-template>

<!-- Modal global y bloqueante de Términos y Condiciones de Uso -->
<app-terms-modal *ngIf="showTermsModal"></app-terms-modal>
