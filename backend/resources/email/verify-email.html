<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Confirma tu cuenta</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f7fb; padding: 0; margin: 0; }
    .wrapper { max-width: 520px; margin: 20px auto; background: #ffffff; border-radius: 12px; padding: 28px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
    .header { text-align: center; margin-bottom: 20px; }
    .title { color: #0b3d60; margin: 0 0 6px; }
    .subtitle { color: #6b7280; margin: 0; font-size: 14px; }
    /* .cta {
      display: block;
      width: 100%;
      text-align: center;
      background: #008f86;
      border: 1px solid #008f86;
      padding: 14px 0;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      margin: 18px 0;
      color: #ffffff;
      font-size: 15px;
    } */
    .cta {
      display: block;
      width: 100%;
      text-align: center;
      background: linear-gradient(135deg, #00C3B4, #008f86);
      border: 1px solid #008f86;
      padding: 12px 0;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
      margin: 18px 0;
    }
    .note { color: #4b5563; font-size: 14px; line-height: 1.6; }
    .footer { text-align: center; margin-top: 22px; color: #9ca3af; font-size: 12px; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <h2 class="title">Confirma tu cuenta</h2>
      <p class="subtitle">CertiVault</p>
    </div>
    <p class="note">Hola {{name}},</p>
    <p class="note">
      Gracias por registrarte. Haz clic en el botón para verificar tu correo y activar tu acceso.
    </p>
    <a class="cta" href="{{verifyLink}}" style="background:#008f86;border:1px solid #008f86;color:#ffffff;text-decoration:none;display:block;width:100%;padding:14px 0;border-radius:10px;font-weight:bold;font-size:15px;">Confirmar cuenta</a>
    <p class="note">Este enlace expira en {{expiresIn}} minutos.</p>
    <div class="footer">
      <p>Enviado por CertiVault • Netics</p>
    </div>
  </div>
</body>
</html>
