services:
  mongo:
    image: ${MONGO_IMAGE}
    container_name: ${MONGO_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ${BACKEND_CONTAINER_NAME}
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    expose:
      - "${BACKEND_PORT}"

  frontend:
    build:
      context: ./certif-app
      dockerfile: Dockerfile
    container_name: ${FRONTEND_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM_HOST: ${BACKEND_UPSTREAM_HOST}
      BACKEND_UPSTREAM_PORT: ${BACKEND_PORT}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:80"

volumes:
  mongo_data:
  backend_uploads:
