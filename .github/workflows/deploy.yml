name: Deploy automático a producción

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Sync repo
        run: |
          cd /home/cdc/certvault
          git fetch origin
          git reset --hard origin/main
          git clean -fd

      - name: Install backend deps
        run: |
          cd /home/cdc/certvault/backend
          npm ci

      - name: Build backend
        run: |
          cd /home/cdc/certvault/backend
          npm run build

      - name: Build frontend
        run: |
          cd /home/cdc/certvault/certif-app
          npm ci
          npm run build

      - name: Restart
        run: |
          pm2 restart certif-app-backend
