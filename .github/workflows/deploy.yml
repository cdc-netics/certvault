name: Deploy automático a producción

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Obtener código actualizado
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 
          clean: true
          ref: main
          #

      - name: Instalar backend
        working-directory: ${{ github.workspace }}/backend
        run: npm install

      - name: Build backend
        working-directory: ${{ github.workspace }}/backend
        run: npm run build

      - name: Rsync backend
        working-directory: ${{ github.workspace }}/backend
        run: rsync -av --delete ${{ github.workspace }}/backend/dist/ /home/cdc/certvault/backend/dist/

      - name: Reiniciar backend service
        #run: pm2 restart certif-app-backend
        run: pm2 restart certif-app-backend --update-env

      - name: Instalar frontend
        working-directory: ${{ github.workspace }}/certif-app
        run: npm install

      - name: Build frontend
        working-directory: ${{ github.workspace }}/certif-app
        run: npm run build

      - name: Rsync frontend
        working-directory: ${{ github.workspace }}/certif-app
        run: rsync -av --delete ${{ github.workspace }}/certif-app/dist/certif-app/ /home/cdc/certvault/certif-app/dist/certif-app/