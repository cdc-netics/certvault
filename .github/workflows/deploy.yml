name: Deploy automático a producción

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Ir al proyecto
        run: cd /home/cdc/certvault/backend/

      - name: Build aplicación
        run: npm run build

      - name: Reiniciar servicio (Ej: PM2 / Docker / Node)
        run: |
          pm2 restart certiapp

      - name: Ir al proyecto
        run: cd /home/cdc/certvault/certi-app/

      - name: Build aplicación
        run: npm run build

