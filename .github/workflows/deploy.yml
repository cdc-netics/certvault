name: Deploy automático a producción

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Build backend
        working-directory: /home/cdc/certvault/backend
        run: |
          npm install
          npm run build

      - name: Restart backend service
        run: pm2 restart certiapp

      - name: Build frontend
        working-directory: /home/cdc/certvault/certif-app
        run: |
          npm install
          npm run build
