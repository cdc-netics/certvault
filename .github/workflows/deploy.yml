name: Deploy a produccion

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30

    env:
      REGISTRY: localhost:5000
      APP_DIR: /opt/certvault
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout código
        # Se actualiza a v6 para ejecutar de manera nativa sobre Node 24 y evitar advertencias de deprecación (EOL de Node 20)
        uses: actions/checkout@v6

      - name: Sanitizar puertos y sockets del host
        run: |
          echo "Deteniendo el stack actual antes de iniciar el build..."
          cd $APP_DIR
          # Detener de forma ordenada el stack actual en producción para liberar todos los sockets
          docker compose down 2>/dev/null || true
          
          echo "Liberando puertos 80, 443 y 27017 en el host..."
          # Remover de forma forzada cualquier contenedor Docker huérfano que esté ocupando los puertos del stack (80, 443 o 27017) en el host
          docker rm -f $(docker ps -q --filter "publish=80") 2>/dev/null || true
          docker rm -f $(docker ps -q --filter "publish=443") 2>/dev/null || true
          docker rm -f $(docker ps -q --filter "publish=27017") 2>/dev/null || true
          # Detener y eliminar contenedores específicos por nombre para evitar colisiones
          docker rm -f certvault-proxy certvault-backend certvault-frontend certvault-mongo 2>/dev/null || true
          # Limpiar redes huérfanas para prevenir conflictos de asignación de IPs
          docker network prune -f 2>/dev/null || true

      - name: Build imagen backend
        run: |
          docker build \
            -t $REGISTRY/certvault-backend:$IMAGE_TAG \
            -t $REGISTRY/certvault-backend:latest \
            ./backend

      - name: Build imagen frontend
        run: |
          docker build \
            -t $REGISTRY/certvault-frontend:$IMAGE_TAG \
            -t $REGISTRY/certvault-frontend:latest \
            ./certif-app

      - name: Push imágenes al registry local
        run: |
          docker push $REGISTRY/certvault-backend:$IMAGE_TAG
          docker push $REGISTRY/certvault-backend:latest
          docker push $REGISTRY/certvault-frontend:$IMAGE_TAG
          docker push $REGISTRY/certvault-frontend:latest

      - name: Actualizar compose files en producción
        run: |
          cp docker-compose.yml $APP_DIR/docker-compose.yml
          cp docker-compose.prod.yml $APP_DIR/docker-compose.prod.yml

      - name: Escribir .env desde GitHub Secrets
        run: |
          # Se usan comillas simples para evitar que bash expanda variables de entorno como $APP_HOST al escribir el archivo
          echo '${{ secrets.CERTVAULT_ENV }}' > $APP_DIR/.env

      - name: Deploy stack
        run: |
          cd $APP_DIR
          # Inicialización de la nueva versión del stack. Los contenedores anteriores ya fueron detenidos y removidos en el paso de sanitización inicial.
          IMAGE_TAG=$IMAGE_TAG docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            up -d --no-build --remove-orphans

      - name: Verificar contenedores
        run: |
          cd $APP_DIR
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.prod.yml \
            ps --format "table {{.Name}}\t{{.Status}}\t{{.Ports}}"

      - name: Health check backend
        run: |
          for i in {1..15}; do
            if docker exec certvault-backend node -e "http = require('http'); req = http.request('http://localhost:3000/api/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)); req.on('error', () => process.exit(1)); req.end();" >/dev/null 2>&1; then
              echo "Backend saludable"
              exit 0
            fi
            echo "Intento $i/15 — esperando backend..."
            sleep 4
          done
          echo "Health check fallido"
          docker logs certvault-backend --tail 50
          exit 1

      - name: Rollback si falla
        if: failure()
        run: |
          echo "Deploy fallido — revirtiendo al tag anterior..."
          cd $APP_DIR

          PREV_TAG=$(curl -s http://localhost:5000/v2/certvault-backend/tags/list \
            | python3 -c "
          import sys, json
          tags = json.load(sys.stdin).get('tags', [])
          shas = [t for t in tags if t != 'latest']
          print(shas[-2] if len(shas) >= 2 else shas[0] if shas else '')
          ")

          if [ -n "$PREV_TAG" ]; then
            echo "Rollback a imagen: $PREV_TAG"
            # Detener y remover de forma limpia el stack fallido para liberar los puertos mapeados en el host
            IMAGE_TAG=$PREV_TAG docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              down
            # Levantar la versión anterior estable
            IMAGE_TAG=$PREV_TAG docker compose \
              -f docker-compose.yml \
              -f docker-compose.prod.yml \
              up -d --no-build
          else
            echo "No hay imagen anterior disponible para rollback"
          fi

      - name: Limpiar imágenes dangling
        if: always()
        run: docker image prune -f